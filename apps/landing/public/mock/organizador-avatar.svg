<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Avatar de exemplo Leela — identidade brasa">
  <!--
    Avatar MOCK (LEELA-R12-FIX-MOCKIMG) — usado quando o organizador não tem
    avatarUrl. Placeholder BRANDED (não cinza, não vazio): base brasa DARK +
    ember superior + arco de "pico". A inicial real do organizador é sobreposta
    pela UI, então isto é fundo de marca, não retrato falso. Autocontido.
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160804"/>
      <stop offset="0.6" stop-color="#0D0503"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FF6E28" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#FF450C" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#8C2100" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5C1600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8244" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFC9A8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#base)"/>
  <rect width="400" height="400" fill="url(#ember)"/>
  <path d="M0 300 L150 190 L250 250 L400 150 L400 400 L0 400 Z" fill="url(#arc)" opacity="0.55"/>
  <path d="M0 340 L170 250 L400 320 L400 400 L0 400 Z" fill="#FF5A1F" opacity="0.14"/>
  <radialGradient id="vin" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
  </radialGradient>
  <rect width="400" height="400" fill="url(#vin)"/>
</svg>
