# .github/workflows/ci.yml
# Pipeline CI — LEELA (LEELA-S000-3-T1)
#
# Roda em todo push/PR para main ou master.
# Jobs: lint → type-check → build → test (com Firestore Emulator).
# E2E Playwright: somente nightly (schedule) ou workflow_dispatch —
#   navegadores Chromium são pesados (~300 MB) e não devem rodar em todo PR.
#
# RUNNER (ubuntu-latest — GitHub-hosted):
#   - Java 17 pré-instalado (necessário para o Firestore Emulator)
#   - firebase-tools instalado no step "Install Firebase CLI"
#   - pnpm 11.9.0 + Node 20 configurados pelos steps de setup
#
# SECRETS OPCIONAIS:
#   TURBO_TOKEN / TURBO_TEAM — habilita Turbo Remote Cache (Vercel)
#     Descomente as linhas no bloco `env` abaixo para ativar.
#
# BRACH PROTECTION:
#   Configure em: Settings → Branches → Require status checks before merging
#   Status checks obrigatórios: "Lint · Type-check · Build · Test"

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly às 03:00 UTC — dispara o job E2E Playwright
    - cron: '0 3 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # Descomente para habilitar Turbo Remote Cache:
  # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ---------------------------------------------------------------------------
  # Job principal: lint + type-check + build + test
  # O Turborepo garante cache entre os steps: pacotes compilados no "Build"
  # são reutilizados pelo "Test" sem recompilação.
  # ---------------------------------------------------------------------------
  lint-type-build-test:
    name: Lint · Type-check · Build · Test
    runs-on: ubuntu-latest
    # Roda em push/PR e também no schedule (para acionar o job e2e abaixo)
    if: github.event_name != 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Cache do Turborepo (.turbo/) — evita rebuild de artefatos inalterados
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Cache dos binários do Firebase Emulator (~/.cache/firebase/emulators/)
      # O Firestore Emulator é um JAR ~100 MB — cache elimina download repetido
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v1-${{ runner.os }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # firebase-tools provê `firebase emulators:exec` usado no step "Test"
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Lint
        run: pnpm turbo run lint

      - name: Type-check
        run: pnpm turbo run type-check

      - name: Build
        run: pnpm turbo run build

      # `firebase emulators:exec --only firestore` inicia o emulador Firestore
      # na porta 8080, executa o comando e retorna o exit code do comando.
      # --project demo-leela usa modo demo (sem credenciais reais).
      # Java 17 já está disponível nos runners ubuntu-latest do GitHub.
      - name: Test (Firestore emulator)
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-leela \
            "pnpm turbo run test"

  # ---------------------------------------------------------------------------
  # Job E2E: roda somente nightly (schedule) ou via workflow_dispatch manual
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Playwright (nightly / manual)
    runs-on: ubuntu-latest
    # Não roda em push/PR comuns — apenas nightly ou dispatch manual
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache dos binários do Playwright (~/.cache/ms-playwright)
      # Chromium + deps de sistema: ~300 MB — cache reduz tempo de ~2min para ~10s
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Pacotes precisam estar compilados para os dev servers subirem
      - name: Build packages
        run: pnpm turbo run build --filter='./packages/*'

      # O playwright.config.ts usa webServer para subir painel (5173) e
      # landing (3000) automaticamente quando CI=true.
      - name: E2E
        run: pnpm test:e2e
