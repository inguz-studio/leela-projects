# .github/workflows/ci.yml
# Pipeline CI — LEELA (LEELA-S000-3-T1 · reescrito na correção do CI, 26/08/2026)
#
# Roda em todo push/PR para main ou master.
# Jobs: lint → type-check → build → test (sem emulador) → functions (emuladores).
# E2E Playwright: somente nightly (schedule) ou workflow_dispatch —
#   navegadores Chromium são pesados (~300 MB) e não devem rodar em todo PR.
#
# NODE É DIVIDIDO DE PROPÓSITO — o mesmo par que vale na máquina de dev
# (ver leela-specs/00-boards/MIGRACAO-DE-MAQUINA.md, "A travessia"):
#   - Toolchain (pnpm, turbo, vite, builds): Node 24 — lido de `.node-version`.
#     O pnpm 11.9.0 importa `node:sqlite` e EXIGE Node >= 22.13; foi por pinar
#     20 aqui que o CI morreu no `Setup pnpm` em todas as 898 execuções até
#     26/08/2026, antes de qualquer teste.
#   - Suíte das functions: Node 20 — o runtime de produção é nodejs20, e há
#     teste que passa sob 20 e falha sob 24 (adminVisaoOnda5Liberacao). O step
#     troca o Node do PATH DEPOIS de todo uso de pnpm/turbo e chama o vitest
#     direto pelo bin local, sem pnpm no meio.
#
# EMULADORES (a receita canônica é a de leela-specs/04-engenharia/como-verificar.md):
#   - painel / landing / design-system: SEM emulador — sob emulators:exec as
#     variáveis FIRESTORE_EMULATOR_HOST etc. vazam para dentro das suítes
#     jsdom e mudam seu comportamento (medido: landing 849/849 verde isolada,
#     2 arquivos vermelhos sob o exec).
#   - functions (demo-leela): firestore + auth + storage. Só firestore — o que
#     este arquivo subia até 26/08 — derruba os arquivos que falam com Auth
#     (helpers/stability.ts) e a suíte de Rules de Storage inteira.
#   - 4 suítes de LANE declaram emulador próprio (porta + project id) e NÃO
#     rodam contra o demo-leela — cada uma tem um step com seu firebase.*.json.
#
# RUNNER (ubuntu-latest — GitHub-hosted):
#   - Java 21 (Temurin) instalado explicitamente via actions/setup-java —
#     firebase-tools 14+ exige Java 21 para o Firestore Emulator
#   - firebase-tools PINADO no step "Install Firebase CLI" — 15.28.1 é a
#     versão que verificou esta receita na máquina de dev em 26/08/2026
#
# SECRETS OPCIONAIS:
#   TURBO_TOKEN / TURBO_TEAM — habilita Turbo Remote Cache (Vercel)
#     Descomente as linhas no bloco `env` abaixo para ativar.
#
# BRANCH PROTECTION:
#   Configure em: Settings → Branches → Require status checks before merging
#   Status checks obrigatórios: "Lint · Type-check · Build · Test"

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly às 03:17 UTC — dispara o job E2E Playwright.
    # 03:17 e não 03:00: o agendador do GitHub atrasa ou DESCARTA crons no
    # topo da hora em horários de pico (o de 27/08 foi pulado); minuto
    # impopular quase nunca é descartado.
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # Descomente para habilitar Turbo Remote Cache:
  # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ---------------------------------------------------------------------------
  # Job principal: lint + type-check + build + test
  # O Turborepo garante cache entre os steps: pacotes compilados no "Build"
  # são reutilizados pelo "Test" sem recompilação.
  # ---------------------------------------------------------------------------
  lint-type-build-test:
    name: Lint · Type-check · Build · Test
    runs-on: ubuntu-latest
    # Roda em push/PR/dispatch; NÃO roda no schedule nightly — o cron
    # existe só para acionar o job e2e abaixo.
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      # Node da toolchain — a MESMA fonte da máquina de dev (.node-version).
      - name: Setup Node.js (toolchain)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      # Cache do Turborepo (.turbo/) — evita rebuild de artefatos inalterados
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Cache dos binários do Firebase Emulator (~/.cache/firebase/emulators/)
      # O Firestore Emulator é um JAR ~100 MB — cache elimina download repetido
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v1-${{ runner.os }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Type-check
        run: pnpm turbo run type-check

      - name: Build
        run: pnpm turbo run build

      # Suítes que rodam SEM emulador — painel, landing e design-system são
      # jsdom puro (como-verificar.md). core, api-client e mobile não têm
      # script `test` e o turbo os pula (lacuna conhecida e documentada lá).
      - name: Test (sem emulador)
        run: pnpm turbo run test --filter=!@leela/functions

      # ----- daqui para baixo é a suíte das functions, sob Node 20 -----------

      # Firestore Emulator exige Java 21 (firebase-tools 14+).
      - name: Setup Java 21 (Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # firebase-tools provê `firebase emulators:exec` usado nos steps de teste.
      # Versão pinada — a que verificou esta receita em dev local (26/08/2026).
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.28.1

      # Troca o Node do PATH para o runtime de produção das functions.
      # ⚠️ Nenhum `pnpm ...` pode rodar depois deste step — o pnpm 11 não
      # sobe em Node 20. O vitest é chamado pelo bin local do pacote.
      - name: Setup Node.js 20 (runtime das functions)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A suíte demo-leela: firestore + auth + storage (receita canônica).
      # As 4 suítes de lane são excluídas AQUI porque rodam nos steps
      # seguintes, cada uma contra o emulador que o próprio arquivo declara —
      # contra o demo-leela elas morrem em ECONNREFUSED, não por defeito.
      - name: Test functions (demo-leela · firestore+auth+storage · Node 20)
        run: firebase emulators:exec --only firestore,auth,storage --project demo-leela "cd functions && ./node_modules/.bin/vitest run --exclude '**/codigoPedidoReserva.integration.test.ts' --exclude '**/codigoPedidoReserva.attack.test.ts' --exclude '**/backfillCodigoPedido.integration.test.ts' --exclude '**/revContasMotor.antagonista.test.ts'"

      # ----- suítes de lane: emulador próprio, porta própria, project próprio -

      - name: Test functions (lane cod5a · RN-474 reserva de código)
        run: firebase emulators:exec --config firebase.cod5a.json --project demo-leela-cod5a "cd functions && ./node_modules/.bin/vitest run src/__tests__/codigoPedidoReserva.integration.test.ts"

      - name: Test functions (lane revcod5a · ataque à reserva de código)
        run: firebase emulators:exec --config firebase.revcod5a.json --project demo-leela-revcod5a "cd functions && ./node_modules/.bin/vitest run src/__tests__/codigoPedidoReserva.attack.test.ts"

      - name: Test functions (lane build5b · backfill de código de pedido)
        run: firebase emulators:exec --config firebase.build5b.json --project demo-leela-build5b "cd functions && ./node_modules/.bin/vitest run src/__tests__/backfillCodigoPedido.integration.test.ts"

      - name: Test functions (lane revcontas · motor de contas, antagonista)
        run: firebase emulators:exec --config firebase.revcontas.json --project demo-leela-revcontas "cd functions && ./node_modules/.bin/vitest run src/__tests__/revContasMotor.antagonista.test.ts"

  # ---------------------------------------------------------------------------
  # Job E2E: roda somente nightly (schedule) ou via workflow_dispatch manual
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Playwright (nightly / manual)
    runs-on: ubuntu-latest
    # Não roda em push/PR comuns — apenas nightly ou dispatch manual
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js (toolchain)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache dos binários do Playwright (~/.cache/ms-playwright)
      # Chromium + deps de sistema: ~300 MB — cache reduz tempo de ~2min para ~10s
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Pacotes precisam estar compilados para os dev servers subirem
      - name: Build packages
        run: pnpm turbo run build --filter='./packages/*'

      # O playwright.config.ts usa webServer para subir painel (5173) e
      # landing (3000) automaticamente quando CI=true.
      - name: E2E
        run: pnpm test:e2e
